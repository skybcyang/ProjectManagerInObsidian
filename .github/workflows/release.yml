name: Release Obsidian Plugin

on:
  push:
    tags:
      - "v*"

env:
  PLUGIN_NAME: project-manager

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            main.js
            styles.css
            manifest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update versions.json
        run: |
          VERSION=${{ steps.version.outputs.version }}
          MIN_APP_VERSION=$(jq -r '.minAppVersion' manifest.json)
          
          # Update versions.json
          jq ". += {\"$VERSION\": \"$MIN_APP_VERSION\"}" versions.json > versions.json.tmp
          mv versions.json.tmp versions.json
          
          echo "Updated versions.json:"
          cat versions.json

      - name: Commit versions.json update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add versions.json
          git diff --cached --quiet || git commit -m "chore: update versions.json for ${{ steps.version.outputs.version }}"
          git push
